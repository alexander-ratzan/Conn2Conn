# E2.2 MSE-only cross-model benchmark (spec v2 E2.2). Roster, packing and reused results.
# Configs: models/configs/benchmark/mse/<Model>.yml (generated by build_configs.py); a `<Model>_fc2sc.yml` is used for
# FC -> SC when it exists. Runs: launch_model.sh <Model> <direction>; results: run.py -> <direction>/{records,tables,figures}.

campaign: e2_mse
results_dir: mse                 # results land in model_benchmark/<results_dir>/<direction>/ (E2.3: composite, final: final)
seeds: [0, 1, 2, 3, 4]
selection: {metric: val_demeaned_r, mode: max}          # never select on test
metrics: [pearson, demeaned_pearson, avg_rank, top1_acc]  # the four figure metrics (mse kept in tables)

# Model type = figure group (colour, and sort by the group's mean on each metric).
types:
  linear_closed_form: {label: "Linear (closed-form)", color: "#3775BA"}
  linear_learned:     {label: "Linear (learned)",     color: "#0F4D92"}
  latent_pretrained:  {label: "Latent / pretrained",  color: "#9A4D8E"}
  deep_baseline:      {label: "Deep-learning baseline", color: "#B64342"}
  pairwise_nodal:     {label: "Pairwise nodal",       color: "#E3962B"}
  null_ceiling:       {label: "Null / ceiling",       color: "#8C8C8C"}

# extra_inputs: the model sees more than the source modality (not input-matched: marked † and never the paired
# reference). FC -> SC caveat: fs_all volumes ~ the SC target's invnodevol normalisation (spec v2 E3).
# packing: tune_gpus_per_trial x max_concurrent_trials on one GPU (D2); time = SLURM limit per seed task.
# Sarwar / NodalMLP repacked 0.5x2 -> 0.25x4 on 2026-10-03: their 0.5x2 tasks were killed (SIGTERM by root) after
# ~2 h 10-25 min, consistent with the cluster's GPU-underutilisation policy; same trial budget.
models:
  CrossModalPCA:                  {type: null_ceiling,       label: "PCA null",            packing: [0.25, 4], time: "1:00:00", role: floor}
  CrossModal_PLS_SVD:             {type: linear_closed_form, label: "PLS-SVD",             packing: [0.25, 4], time: "1:00:00"}
  CrossModal_PCA_PLS:             {type: linear_closed_form, label: "PCA-PLS",             packing: [0.25, 4], time: "2:00:00"}
  CrossModal_ConditionalGaussian: {type: linear_closed_form, label: "Conditional Gaussian", packing: [0.25, 4], time: "3:00:00"}
  CrossModal_PCA_PLS_learnable:   {type: linear_learned,     label: "PCA-PLS learnable",   packing: [0.25, 4], time: "4:00:00"}
  CrossModal_linear_backbone:     {type: linear_learned,     label: "Linear backbone",     packing: [0.25, 4], time: "3:00:00"}
  CrossModal_PCA_PLS_CovProjector: {type: linear_learned,    label: "PCA-PLS + covariates", packing: [0.25, 4], time: "5:00:00",
                                   extra_inputs: "FreeSurfer fs_all + demographics"}
  MaskedMLPPretrainer:            {type: latent_pretrained,  label: "Masked MLP pretrainer", packing: [0.25, 4], time: "4:00:00", gate: true, objective: "native latent_mse"}
  Sarwar2020MLP:                  {type: deep_baseline,      label: "Sarwar MLP",          packing: [0.25, 4],  time: "8:00:00"}
  Chen2024GCN:                    {type: deep_baseline,      label: "Chen GCN",            packing: [0.5, 2],  time: "8:00:00"}
  NodalGNN:                       {type: pairwise_nodal,     label: "Nodal GNN",           packing: [0.5, 2],  time: "8:00:00"}
  NodalMLP:                       {type: pairwise_nodal,     label: "Nodal MLP",           packing: [0.25, 4],  time: "6:00:00"}

# Results reused from other experiments (no rerun), read per direction.
reuse:
  # Krakencoder (E2.1 retrain, seeds 0-4, both directions): two variants (user 2026-10-02).
  Krakencoder_mse:
    type: deep_baseline
    label: "Krakencoder (MSE)"
    objective: "MSE + its fixed latent losses"   # mse.w1000 + enceye / encdist / latentsim; no output identity terms
    records: {sc2fc: scripts/experiments/composite_loss/krakencoder/sc2fc/tables/seed_records.csv,
              fc2sc: scripts/experiments/composite_loss/krakencoder/fc2sc/tables/seed_records.csv}
    combo_id: mse_only
  Krakencoder_paper:
    type: deep_baseline
    label: "Krakencoder (paper loss)"
    objective: "native (paper loss: + corr-eye + neighbor dist)"
    records: {sc2fc: scripts/experiments/composite_loss/krakencoder/sc2fc/tables/seed_records.csv,
              fc2sc: scripts/experiments/composite_loss/krakencoder/fc2sc/tables/seed_records.csv}
    combo_id: kraken_default
  TestRetest:
    type: null_ceiling
    label: "Test-retest ceiling"
    role: ceiling
    records: {sc2fc: scripts/experiments/composite_loss/ceiling/test_retest.csv}

# Per-direction rosters. FC -> SC excludes models whose reverse variant is not built (spec v2 E2.0).
directions:
  sc2fc:
    source: SC
    target: FC
    models: [CrossModalPCA, CrossModal_PLS_SVD, CrossModal_PCA_PLS, CrossModal_ConditionalGaussian,
             CrossModal_PCA_PLS_learnable, CrossModal_linear_backbone, CrossModal_PCA_PLS_CovProjector,
             MaskedMLPPretrainer, Sarwar2020MLP, Chen2024GCN, NodalGNN, NodalMLP]
    reuse: [Krakencoder_mse, Krakencoder_paper, TestRetest]
  fc2sc:
    source: FC
    target: SC
    models: [CrossModalPCA, CrossModal_PLS_SVD, CrossModal_PCA_PLS, CrossModal_ConditionalGaussian,
             CrossModal_PCA_PLS_learnable, CrossModal_linear_backbone, CrossModal_PCA_PLS_CovProjector,
             MaskedMLPPretrainer, Sarwar2020MLP]
    gate_failed: {MaskedMLPPretrainer: "latent gate failed 2026-10-03: mean val 0.132 < threshold 0.169 (_learnable 0.179 - 0.01)"}
    excluded: {Chen2024GCN: "reverse variant not built (FC graph threshold)", NodalGNN: "reverse variant not built",
               NodalMLP: "reverse variant not built (SC-row input = target)"}
    reuse: [Krakencoder_mse, Krakencoder_paper]

# Autonomous run (user 2026-10-02): GPU-h cap for both directions; time limit per model = time_factor x pilot wall
# time per seed (capped). Stop if the projection exceeds the cap.
budget: {gpu_h_cap: 130, time_factor: 1.5, time_cap_h: 12, min_time_h: 0.5, max_retries: 1, max_error_frac: 0.2}

# Latent gate (D2): seeds 0-1 pilot; enters the full run if best val >= _learnable's val on the same seeds - margin.
gate: {models: [MaskedMLPPretrainer], seeds: [0, 1], trials: 12, reference: CrossModal_PCA_PLS_learnable, margin: 0.01}
