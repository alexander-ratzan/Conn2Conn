# Spec v3 E3: composite-loss cross-model benchmark (v2:E2.2 rerun with composite-loss weights tuned per model and seed).
# Select this campaign with MB_CAMPAIGN_CONFIG=config_composite_loss.yml for submit.py / autopilot.py / run.py.
# Configs: models/configs/benchmark/composite_loss/<Model>[_fc2sc].yml (build_composite_configs.py; grids + scales
# recorded in composite_loss/grids.yml). Every task writes two best-trial reports (val demeaned r, val avg rank) from one tune (D3 d).
campaign: e3_comp
results_dir: composite_loss       # model_benchmark/composite_loss/<direction>/<selection>/
configs_dir: models/configs/benchmark/composite_loss
report_metrics: [val_demeaned_r, val_avg_rank]
selections: {val_demeaned_r: by_demeaned_r, val_avg_rank: by_avg_rank}
seeds: [0, 1, 2, 3, 4]
selection: {metric: val_demeaned_r, mode: max}
metrics: [pearson, demeaned_pearson, avg_rank, top1_acc]
batch_size: 64                    # every composite run (v2:D4, D3 c)
trials: {per_weight_key: 8, cap: 96}   # num_samples = min(cap, E2.2 trials + 8 x searched weight keys)
terms: [varmatch, correye_dm, neidist]  # raw correye excluded (v2:D5)
# Loss-weight grid (D3 b, revised 2026-10-20): one declared set per term and direction, identical for every model, so
# the cross-model comparison is not confounded by model-specific ranges. Weights are in units of MSE at that model's
# reference scale (fixed `kwargs.scale` = c_t, measured for every model by composite_scales.py). Informed by v2:E1
# (useful weights 0.1-1, nothing gained above ~1; FC -> SC fronts favour small weights), not derived from its tables.
weight_grid:
  sc2fc: {varmatch: [0.0, 0.1, 0.3, 1.0], correye_dm: [0.0, 0.1, 0.3, 1.0], neidist: [0.0, 0.1, 0.3, 1.0]}
  fc2sc: {varmatch: [0.0, 0.1, 0.3, 0.5], correye_dm: [0.0, 0.1, 0.3, 0.5], neidist: [0.0, 0.1, 0.3, 0.5]}
# Ray actor reuse ON, as E2.2: each worker builds HCP_Base / loaders once and keeps them across trials. Turning it off
# (2026-10-20, to avoid the 2026-10-19 reset_config stalls) made every trial rebuild the data (~10 min of idle GPU per
# trial wave in the 2026-10-21 smoke test), so it was reverted the same day; a reset_config stall is handled as a task
# failure (one retry, D3 e) instead.
tune_reuse_actors: true
# Lightning's default per-trial ModelCheckpoint (unused weights in Ray's working dir); off unless set true here.
tune_lightning_checkpoints: false

types:
  linear_closed_form: {label: "Linear (closed-form)", color: "#8DB8E8", header_color: "#3775BA"}
  linear_learned:     {label: "Linear (learned)",     color: "#0F4D92"}
  latent_pretrained:  {label: "Latent / pretrained",  color: "#9A4D8E"}
  deep_baseline:      {label: "Deep-learning baseline", color: "#B64342"}
  pairwise_nodal:     {label: "Pairwise nodal",       color: "#42949E"}
  null_ceiling:       {label: "Null / ceiling",       color: "#8C8C8C", header: "Null"}

# Roster (D3 a): the stable learned edge-space models, both directions. packing = [GPU per trial, concurrent trials]. Reference scales for every model come from
# composite_loss/reference_scales.yml (composite_scales.py at each seed's E2.2 best config, MSE-only, batch 64).
models:
  CrossModal_PCA_PLS_learnable:    {type: linear_learned, label: "PCA-PLS learnable", packing: [0.125, 8], cpus: 16, time: "2:30:00"}
  CrossModal_linear_backbone:      {type: linear_learned, label: "Linear backbone", packing: [0.125, 8], cpus: 16, time: "2:30:00"}
  CrossModal_PCA_PLS_CovProjector: {type: linear_learned, label: "PCA-PLS + covariates", packing: [0.125, 8], cpus: 16, time: "2:30:00",
                                    extra_inputs: "FreeSurfer fs_all + demographics"}
  Sarwar2020MLP:                   {type: deep_baseline, label: "Sarwar MLP", packing: [0.125, 8], cpus: 16, time: "2:30:00"}

# E2.2 rows reused unchanged (MSE-only; not rerun): models outside the roster, and roster cells whose grid is MSE only.
reuse:
  CrossModalPCA_mse:      {type: null_ceiling, label: "PCA null (MSE, E2.2)", role: floor, model: CrossModalPCA,
                           records: {sc2fc: scripts/experiments/model_benchmark/mse/sc2fc/tables/seed_records.csv, fc2sc: scripts/experiments/model_benchmark/mse/fc2sc/tables/seed_records.csv}}
  CrossModal_PCA_PLS_mse: {type: linear_closed_form, label: "PCA-PLS (E2.2)", model: CrossModal_PCA_PLS,
                           records: {sc2fc: scripts/experiments/model_benchmark/mse/sc2fc/tables/seed_records.csv, fc2sc: scripts/experiments/model_benchmark/mse/fc2sc/tables/seed_records.csv}}
  CrossModal_ConditionalGaussian_mse: {type: linear_closed_form, label: "Conditional Gaussian (E2.2)", model: CrossModal_ConditionalGaussian,
                           records: {sc2fc: scripts/experiments/model_benchmark/mse/sc2fc/tables/seed_records.csv, fc2sc: scripts/experiments/model_benchmark/mse/fc2sc/tables/seed_records.csv}}
  Krakencoder_paper:      {type: deep_baseline, label: "Krakencoder (paper loss)", objective: "native (paper loss)",
                           records: {sc2fc: scripts/experiments/composite_loss/krakencoder/sc2fc/tables/seed_records.csv,
                                     fc2sc: scripts/experiments/composite_loss/krakencoder/fc2sc/tables/seed_records.csv},
                           combo_id: kraken_default}

directions:
  sc2fc:
    source: SC
    target: FC
    models: [CrossModal_PCA_PLS_learnable, CrossModal_linear_backbone, CrossModal_PCA_PLS_CovProjector, Sarwar2020MLP]
    reuse: [CrossModalPCA_mse, CrossModal_PCA_PLS_mse, CrossModal_ConditionalGaussian_mse, Krakencoder_paper]
  fc2sc:
    source: FC
    target: SC
    models: [CrossModal_PCA_PLS_learnable, CrossModal_linear_backbone, CrossModal_PCA_PLS_CovProjector, Sarwar2020MLP]
    reuse: [CrossModalPCA_mse, CrossModal_PCA_PLS_mse, CrossModal_ConditionalGaussian_mse, Krakencoder_paper]

# Autonomy (D3 e): cap 80 GPU-h over both directions; time per model = time_factor x pilot wall (capped).
# GPU-usage policy (NYU HPC): jobs averaging < 50% GPU utilisation for > 2 h are cancelled (warning < 70%); these models
# are too small to reach that, so every task must finish within 2 h: 8 trials per GPU (0.125 x 8, 2 CPUs per trial)
# halves wall time vs E2.2's 0.25 x 4, and autopilot refuses to launch a model whose pilot wall exceeds max_wall_h.
budget: {gpu_h_cap: 80, time_factor: 1.5, time_cap_h: 2.5, min_time_h: 0.5, max_retries: 1, max_error_frac: 0.2,
         max_wall_h: 1.75}
gate: {}
