# Composite-loss protocol, replicability instance (spec v2 E1, D4): CrossModal_PCA_PLS_learnable.yml, MSE-only.
# Same protocol as linear_backbone/composite_loss: loss_type fixed to composite (no latent losses), loss-weight and
# EMA keys removed from the search, batch 64, varmatch / correye / neidist logged as monitor-only terms.
learned: true

default:
  data:
    source: SC
    target: FC
  model:
    name: CrossModal_PCA_PLS_learnable
    n_components_pca_source: 256
    n_components_pca_target: 256
    n_components_pls: 16
    learn_encoder: false
    learn_mid: true
    learn_decoder: false
    random_init: false
    l1_reg: 0.0
    l2_reg: 0.0001
    dropout: 0.2
    device: null
  trainer:
    lr: 1.0e-4
    loss_type: composite
    loss_terms:
      - {name: mse, weight: 1.0}
    loss_normalize: auto            # one active term -> none: exactly plain MSE
    loss_monitor_terms: [varmatch, correye, neidist]
    max_epochs: 200
    batch_size: 64                  # protocol batch size (D4)
    log_every: 5

search_space:
  n_components_pca_source:
    type: choice
    values: [64, 128, 256, 512]
  n_components_pca_target:
    type: choice
    values: [64, 128, 256, 512]
  n_components_pls:
    type: choice
    values: [4, 8, 16, 32, 64]
  learn_encoder:
    type: choice
    values: [false, true]
  learn_mid:
    type: choice
    values: [true, false]
  learn_decoder:
    type: choice
    values: [false, true]
  l1_reg:
    type: choice
    values: [0.0, 1.0e-5, 1.0e-4, 1.0e-3]
  l2_reg:
    type: loguniform
    lower: 1.0e-6
    upper: 1.0e-2
  random_init:
    type: choice
    values: [false, true]
  dropout:
    type: uniform
    lower: 0.0
    upper: 0.4
  lr:
    type: loguniform
    lower: 1.0e-5
    upper: 1.0e-2
  max_epochs:
    type: choice
    values: [50, 100, 150, 200, 250]
