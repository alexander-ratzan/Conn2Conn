# Krakencoder instance of the composite-loss experiment (spec v2 E1 grid, E2.1 retrainable Krakencoder).
# Same 16-cell grid as the other instances (grid v1) plus Krakencoder's paper-default loss as a reference cell; the
# identifiability terms vary, MSE and the latent terms stay fixed. Architecture / optimiser are the paper defaults
# (no Stage 1 tune). Trained on all flavors (cross-parcellation alignment), evaluated on Glasser in both directions.
#
#   python scripts/experiments/composite_loss/krakencoder/grid_runner.py plan --set pilot
#   sbatch --array=0-<n-1> --export=ALL,SET=pilot scripts/experiments/composite_loss/krakencoder/launch_grid.sh
#   python scripts/experiments/composite_loss/krakencoder/grid_runner.py collect --set grid
#
# Weights are Krakencoder's native loss weights (its terms act in its PCA-256 output space, next to mse.w1000), so
# they are not on the scaled-term footing of the other instances (c_t calibration); compare shapes and directions.

model: Krakencoder
base_config: models/configs/Krakencoder.yml
grid_file: scripts/experiments/composite_loss/grid.yml        # v1: 16 cells, shared with the other instances
term_map: {varmatch: var, correye: correye, neidist: neidist}  # grid term -> Krakencoder loss name (same formulas)
# Comparability: Krakencoder's native terms act in its mean-centred PCA-256 space, so its `correye` is closest to our
# `correye_dm` (demeaned correye; E1 grid v2/v3) restricted to the top 256 PCs, not to plain `correye`. `neidist`
# (distances) and `var` (relative variance across subjects) are unaffected by demeaning. Grid stays v1 (user decision).
fixed_loss: "mse.w1000+enceye.w10+encdist.w10+latentsimloss.w10000"   # in every cell (MSE anchor + latent terms)
# Option B (user, 2026-10-01): grid level x anchor = native weight, anchored to the paper default. correye / neidist:
# anchor 1 (paper weight). var (not in the paper): anchor 9.2, so var at level 1.0 has the same share of the MSE term
# as correye at its paper weight. Measured at the paper-default solution (kraken_default seed 0, ep 2000, batches of
# 64, Krakencoder's training space, checks/term_magnitudes.py): correye/(1000*mse) = 0.16-0.27 (mean 0.199 over the
# four Glasser paths), var/(1000*mse) = 0.020-0.025 (mean 0.0217); 0.199 / 0.0217 = 9.2. neidist's value is ~0 and
# negative (a self-vs-nearest-other distance difference), so it keeps the paper anchor.
term_anchor: {varmatch: 9.2, correye: 1.0, neidist: 1.0}
reference_cells:
  # Krakencoder paper default: correye + neidist at weight 1 (with the fixed terms above)
  - {id: kraken_default, block: reference, varmatch: 0.0, correye: 1.0, neidist: 1.0}
extension_cells:            # option B: one dose level above the paper default (grid v1 stops at 1.0)
  - {id: vm_2.0,  block: extension, varmatch: 2.0, correye: 0.0, neidist: 0.0}
  - {id: ce_2.0,  block: extension, varmatch: 0.0, correye: 2.0, neidist: 0.0}
  - {id: nd_2.0,  block: extension, varmatch: 0.0, correye: 0.0, neidist: 2.0}
  - {id: all_2.0, block: extension, varmatch: 2.0, correye: 2.0, neidist: 2.0}

recipe:                     # overrides of base_config `retrain:` for every fit
  batch_size: 64            # protocol batch size (D4); Krakencoder default is 41
  epochs: 2000              # pilot measures where val plateaus at batch 64; set the grid value from it
  checkpoint_every: 500     # grid (user 2026-10-01; pilot used 100): 4 scored checkpoints per fit
  infer_parcellations: [Glasser]

eval:
  parcellation: Glasser
  loss_batch_size: 64

tag_prefix: cl_kraken_v1    # results/krakencoder/<tag_prefix>_<cell>/seed<S>/

sets:
  pilot:                    # D2: compute + epoch pilot, packed
    cells: [mse_only, ce_0.5, nd_0.5, kraken_default]
    seeds: [0]
  grid:
    cells: all              # 16 grid v1 cells + reference + extension = 21 cells
    seeds: [0, 1, 2, 3, 4]
  noise:                    # retrain variability at a fixed split: init seeds only
    cells: [kraken_default]
    seeds: [0]
    random_seeds: [1, 2]    # random_seed 0 is the grid fit itself

packing:
  fits_per_job: 4           # concurrent fits on one GPU

# Autonomy (user, 2026-10-01: run the pilot, then carry on autonomously). The agent proceeds pilot -> grid -> report
# without asking while every gate holds; any failed gate stops the run and is reported.
autonomy:
  pilot_gate:
    - all pilot fits finish (no OOM, no underutilisation kill); packed GPU use is logged (results/logs/cl_kraken_*.gpu.csv)
    - kraken_default (batch 64) final val demeaned r within 0.01 of the batch-41 parity fit, both directions
      (2026-10-01 pilot: FC->SC -0.017; user accepted the batch-64 gap as a finding)
  epochs_rule: >-
    smallest checkpoint epoch at which, for both directions, the mean over pilot cells of val demeaned r is >= 98% of
    its maximum over checkpoints and val avg rank is >= its maximum - 0.005; add 20% and round up to a multiple of
    100 (cap 2000). Written to recipe.epochs before the grid starts.
  grid_budget_gpu_h: 43      # user 2026-10-01: ~42 GPU-h accepted with checkpoint_every 500 (was 40); projected = 27 jobs x measured packed job wall (scaled to the chosen epochs); above -> stop
  stop_if:
    - any grid job fails twice (after its automatic requeue)
    - a cell's fits are all non-finite or worse than mse_only by > 0.05 val demeaned r in both directions (diverged)
  after_grid: collect tables, per-cell summary (mean +- SD over seeds, by direction), dose and epoch-curve figures (PNG),
    write-up, spec update; then stop for review.
