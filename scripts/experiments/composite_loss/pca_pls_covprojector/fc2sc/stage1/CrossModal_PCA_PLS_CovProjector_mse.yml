# E3 Phase D (FC -> SC) Stage 1 PILOT for CrossModal_PCA_PLS_CovProjector with all covariates (user 2026-10-02).
# SC -> FC (E1.9) was hand-selected (E1.7 backbone + covariates, max_epochs 30 from the covariate val curves); here the
# same 4 optimiser keys as pca_pls_learnable are searched instead, with an epoch range centred on that short schedule
# (covariates overfit within ~30 epochs in SC -> FC). Architecture and covariate branch fixed as in E1.9 (defaults below
# are the SC -> FC values, used only as the starting point). 12 trials x seeds 0-4, packed 4 per GPU.
# Pilot gate (config.yml `pilot_gate`): continue to consensus -> grid only if the per-seed bests clear the stop threshold
# and the chosen lr / max_epochs are not at a search-space edge; otherwise widen the space and re-pilot.
# MSE-only here; the grid adds the composite terms. Monitors: varmatch / correye / correye_dm / neidist. Batch 64 (D4).
learned: true

default:
  data:
    source: FC
    target: SC
  model:
    name: CrossModal_PCA_PLS_CovProjector
    n_components_pca_source: 256
    n_components_pca_target: 256
    n_components_pls: 16
    learn_encoder: false
    learn_mid: true
    learn_decoder: false
    random_init: false
    l1_reg: 0.0
    l2_reg: 0.00015742358297361208
    dropout: 0.24941012763487663
    cov_sources: [fs_all, age, sex, race_eth]
    cov_projectors:
      fs_all:   {type: linear, out_dim: 64}
      age:      {type: linear, out_dim: 4}
      sex:      {type: linear, out_dim: 4}
      race_eth: {type: linear, out_dim: 8}
    cov_fusion:
      type: mlp
      hidden_dims: [64]
      dropout: 0.1
      layer_norm: true
    use_target_scores_in_projector: false
    device: null
  trainer:
    lr: 0.0005425048849011945
    loss_type: composite
    loss_terms:
      - {name: mse, weight: 1.0}
    loss_normalize: auto            # one active term -> none: exactly plain MSE
    loss_monitor_terms: [varmatch, correye, correye_dm, neidist]
    max_epochs: 150
    batch_size: 64                  # protocol batch size (D4)
    log_every: 5

search_space:
  l2_reg:
    type: loguniform
    lower: 1.0e-6
    upper: 1.0e-2
  dropout:
    type: uniform
    lower: 0.0
    upper: 0.4
  lr:
    type: loguniform
    lower: 1.0e-4          # short schedules: the E1.7 floor (3e-5) barely trains in 20-80 epochs
    upper: 3.0e-3
  max_epochs:
    type: choice
    values: [20, 30, 50, 80, 120]
    consensus: median      # ordered: median of the per-seed bests (snapped), not a majority vote
