learned: true

default:
  data:
    source: SC
    target: FC
  model:
    name: Chen2024GCN
    layer_num: 2
    conv_dim: 64
    dnn_dim: 32
    node_feature_type: identity
    l1_reg: 0.0
    l2_reg: 1.0e-4
    add_self_loops: true
    device: null
  trainer:
    lr: 2.0e-3
    loss_type: composite
    loss_terms:   # MSE-only by default; the other terms are switched on by the weight search
      - {name: mse, weight: 1.0}
      - {name: varmatch, weight: 0.0}
      - {name: correye, weight: 0.0}
      - {name: neidist, weight: 0.0}
    loss_normalize: auto
    max_epochs: 1000
    batch_size: 4
    log_every: 1

search_space:
  layer_num:
    type: choice
    values: [2, 3]
  conv_dim:
    type: choice
    values: [32, 64, 128]
  dnn_dim:
    type: choice
    values: [16, 32, 64]
  node_feature_type:
    type: choice
    values: [identity]
  l2_reg:
    type: loguniform
    lower: 1.0e-5
    upper: 1.0e-3
  lr:
    type: loguniform
    lower: 5.0e-4
    upper: 5.0e-3
  max_epochs:
    type: choice
    values: [500, 750, 1000]
  loss_weight_neidist:
    type: choice
    values: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0]
  loss_weight_correye:
    type: choice
    values: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0]
  loss_weight_varmatch:
    type: choice
    values: [0.0, 0.1, 0.25, 0.5, 1.0]
  loss_scale_warmup_steps:
    type: choice
    values: [20, 50, 100]
  loss_scale_ema_decay:
    type: choice
    values: [0.9, 0.95, 0.99]
