learned: true

default:
  data:
    source: SC
    target: FC
  model:
    name: NodalGNN
    layer_num: 2
    hidden_dim: 64
    decoder_dim: 32
    dropout: 0.2
    edge_dropout: 0.0
    l1_reg: 0.0
    l2_reg: 1.0e-4
    use_volume: true
    use_spatial: true
    use_r2t: true
    add_self_loops: true
    device: null
  trainer:
    lr: 2.0e-3
    loss_type: composite
    loss_terms:   # MSE-only by default; the other terms are switched on by the weight search
      - {name: mse, weight: 1.0}
      - {name: varmatch, weight: 0.0}
      - {name: correye, weight: 0.0}
      - {name: neidist, weight: 0.0}
    loss_normalize: auto
    max_epochs: 750
    batch_size: 8
    log_every: 1

search_space:
  layer_num:
    type: choice
    values: [2, 3, 4]
  hidden_dim:
    type: choice
    values: [32, 64, 96, 128, 160]
  decoder_dim:
    type: choice
    values: [16, 32, 64, 96]
  dropout:
    type: choice
    values: [0.05, 0.1, 0.2, 0.35, 0.5, 0.65]
  edge_dropout:
    type: choice
    values: [0.0, 0.05, 0.1, 0.2, 0.3]
  l2_reg:
    type: loguniform
    lower: 5.0e-6
    upper: 5.0e-3
  lr:
    type: loguniform
    lower: 2.0e-4
    upper: 7.0e-3
  max_epochs:
    type: choice
    values: [200, 400, 500, 750, 1000, 1500]
  loss_weight_neidist:
    type: choice
    values: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0]
  loss_weight_correye:
    type: choice
    values: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0]
  loss_weight_varmatch:
    type: choice
    values: [0.0, 0.1, 0.25, 0.5, 1.0]
  loss_scale_warmup_steps:
    type: choice
    values: [20, 50, 100]
  loss_scale_ema_decay:
    type: choice
    values: [0.9, 0.95, 0.99]
