learned: true

# Test variant: all covariates combined (fs_all, fs_volumes, age, sex, race_eth)
# Source: SC → FC

default:
  data:
    source: SC
    target: FC
  model:
    name: CrossModal_PCA_PLS_CovProjector
    n_components_pca_source: 256
    n_components_pca_target: 256
    n_components_pls: 16
    learn_encoder: false
    learn_mid: false
    learn_decoder: false
    random_init: false
    l1_reg: 0.0
    l2_reg: 0.0001
    dropout: 0.1
    cov_sources: [fs_all, fs_volumes, age, sex, race_eth]
    cov_projectors:
      fs_all:     {type: linear, out_dim: 64}
      fs_volumes: {type: linear, out_dim: 16}
      age:        {type: linear, out_dim: 4}
      sex:        {type: linear, out_dim: 4}
      race_eth:   {type: linear, out_dim: 8}
    cov_fusion:
      type: mlp
      hidden_dims: [64]
      dropout: 0.1
      layer_norm: true
    use_target_scores_in_projector: false
    device: null
  trainer:
    lr: 1.0e-4
    loss_type: composite
    loss_terms:   # MSE-only by default; the other terms are switched on by the weight search
      - {name: mse, weight: 1.0}
      - {name: varmatch, weight: 0.0}
      - {name: correye, weight: 0.0}
      - {name: neidist, weight: 0.0}
    loss_normalize: auto
    max_epochs: 200
    batch_size: 64
    log_every: 5

search_space:
  n_components_pca_source:
    type: choice
    values: [128, 256]
  n_components_pca_target:
    type: choice
    values: [128, 256]
  n_components_pls:
    type: choice
    values: [8, 16, 32]
  cov_projectors:
    type: choice
    values:
      - {fs_all: {type: linear, out_dim: 32},  fs_volumes: {type: linear, out_dim: 8},  age: {type: linear, out_dim: 2}, sex: {type: linear, out_dim: 2}, race_eth: {type: linear, out_dim: 4}}
      - {fs_all: {type: linear, out_dim: 64},  fs_volumes: {type: linear, out_dim: 16}, age: {type: linear, out_dim: 4}, sex: {type: linear, out_dim: 4}, race_eth: {type: linear, out_dim: 8}}
      - {fs_all: {type: linear, out_dim: 128}, fs_volumes: {type: linear, out_dim: 32}, age: {type: linear, out_dim: 4}, sex: {type: linear, out_dim: 4}, race_eth: {type: linear, out_dim: 8}}
      - {fs_all: {type: linear, out_dim: 128}, fs_volumes: {type: linear, out_dim: 32}, age: {type: linear, out_dim: 8}, sex: {type: linear, out_dim: 4}, race_eth: {type: linear, out_dim: 16}}
  cov_fusion:
    type: choice
    values:
      - {type: linear}
      - {type: mlp, hidden_dims: [64],  dropout: 0.1, layer_norm: true}
      - {type: mlp, hidden_dims: [128], dropout: 0.2, layer_norm: true}
  dropout:
    type: uniform
    lower: 0.0
    upper: 0.3
  lr:
    type: loguniform
    lower: 1.0e-5
    upper: 1.0e-3
  max_epochs:
    type: choice
    values: [100, 150, 200]
  loss_weight_neidist:
    type: choice
    values: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0]
  loss_weight_correye:
    type: choice
    values: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0]
  loss_weight_varmatch:
    type: choice
    values: [0.0, 0.1, 0.25, 0.5, 1.0]
  loss_scale_warmup_steps:
    type: choice
    values: [20, 50, 100]
  loss_scale_ema_decay:
    type: choice
    values: [0.9, 0.95, 0.99]
