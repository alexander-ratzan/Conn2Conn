# weight grid = config_composite_loss.yml weight_grid[fc2sc]; scales measured (composite_loss/reference_scales.yml). Do not edit.
learned: true
default:
  model:
    name: CrossModal_PCA_PLS_CovProjector
    n_components_pca_source: 256
    n_components_pca_target: 256
    n_components_pls: 16
    learn_encoder: false
    learn_mid: false
    learn_decoder: false
    random_init: false
    l1_reg: 0.0
    l2_reg: 0.0001
    dropout: 0.1
    cov_sources: [fs_all, age, sex, race_eth]
    cov_projectors:
      fs_all: {type: linear, out_dim: 64}
      age: {type: linear, out_dim: 4}
      sex: {type: linear, out_dim: 4}
      race_eth: {type: linear, out_dim: 8}
    cov_fusion:
      type: mlp
      hidden_dims: [64]
      dropout: 0.1
      layer_norm: true
    use_target_scores_in_projector: false
    device: null
  trainer:
    lr: 0.0001
    max_epochs: 200
    batch_size: 64
    log_every: 5
    loss_type: composite
    loss_terms:
    - {name: mse, weight: 1.0}
    - name: varmatch
      weight: 0.0
      kwargs: {scale: 196.498588}
    - name: correye_dm
      weight: 0.0
      kwargs: {scale: 2014.431928}
    - name: neidist
      weight: 0.0
      kwargs: {scale: 31.598434}
    loss_normalize: auto
search_space:
  n_components_pca_source:
    type: choice
    values: [128, 256]
  n_components_pca_target:
    type: choice
    values: [128, 256]
  n_components_pls:
    type: choice
    values: [8, 16, 32]
  cov_projectors:
    type: choice
    values:
    - fs_all: {type: linear, out_dim: 32}
      age: {type: linear, out_dim: 2}
      sex: {type: linear, out_dim: 2}
      race_eth: {type: linear, out_dim: 4}
    - fs_all: {type: linear, out_dim: 64}
      age: {type: linear, out_dim: 4}
      sex: {type: linear, out_dim: 4}
      race_eth: {type: linear, out_dim: 8}
    - fs_all: {type: linear, out_dim: 128}
      age: {type: linear, out_dim: 8}
      sex: {type: linear, out_dim: 4}
      race_eth: {type: linear, out_dim: 16}
  cov_fusion:
    type: choice
    values:
    - {type: linear}
    - type: mlp
